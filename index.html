<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>Wortgarten</title>
<meta name="apple-mobile-web-app-title" content="Wortgarten">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A 50-minute German session per story: words, reading, writing, speaking.">
<meta name="theme-color" content="#3B6D11">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f7f4ee; --card: #ffffff; --ink: #1d2230; --muted: #6b7180; --line: #e6e1d8;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #d9efec;
  --good: #15803d; --good-soft: #dcf3e3; --bad: #b42318; --bad-soft: #fbe3e0;
  --warm: #c2620a; --warm-soft: #fcebd6;
  --der: #1d4ed8; --die: #be123c; --das: #15803d;
  --radius: 18px; --shadow: 0 1px 2px rgba(20,20,30,.06), 0 4px 16px rgba(20,20,30,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --card: #1d212a; --ink: #eceef2; --muted: #9aa1ae; --line: #2c313c;
    --accent: #2bb3a6; --accent-ink: #06201d; --accent-soft: #173a37;
    --good: #4ade80; --good-soft: #163522; --bad: #f87171; --bad-soft: #3d1c1c;
    --warm: #f5a54a; --warm-soft: #3a2a17;
    --der: #7aa2ff; --die: #ff7a9a; --das: #5fd38a;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
#app { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); min-height: 100vh; }
h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 4px; }
h2 { font-size: 20px; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 0 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 0 0 14px; box-shadow: var(--shadow); }
.row { display: flex; gap: 10px; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 16px; cursor: pointer; font-weight: 600; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good); color: #fff; border-color: var(--good); }
.btn.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.big { width: 100%; font-size: 19px; min-height: 58px; border-radius: 16px; }
.btn.icon { width: 48px; padding: 0; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; }
.chip.warm { background: var(--warm-soft); color: var(--warm); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.bar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
.segs { display: flex; gap: 4px; }
.segs > i { flex: 1; height: 12px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.segs > i > b { position: absolute; inset: 0; background: var(--accent); }
.steps { display: flex; gap: 6px; margin: 12px 0 4px; }
.steps > div { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
.steps > div > i { display: block; height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 5px; }
.steps > div.done > i { background: var(--accent); }
.steps > div.now > i { background: var(--warm); }
.steps > div.now { color: var(--ink); font-weight: 600; }
.steps > div.skip { opacity: .4; }
.der { color: var(--der); } .die { color: var(--die); } .das { color: var(--das); }
.word { font-size: 30px; font-weight: 700; line-height: 1.2; margin: 6px 0; }
.ex { font-size: 18px; }
.center { text-align: center; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 6px; margin: -16px 0 10px; }
.para { padding: 8px 10px; border-radius: 10px; margin: 0 -10px 4px; cursor: pointer; font-size: 18px; line-height: 1.6; }
.para.on { background: var(--warm-soft); }
.sp { font-weight: 700; color: var(--accent); }
.qa { border-top: 1px solid var(--line); padding: 12px 0; }
.qa .ans { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; margin-top: 8px; font-size: 16px; }
textarea, input[type=text], input[type=number] { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 18px; }
textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.ok { color: var(--good); font-weight: 700; }
.no { color: var(--bad); font-weight: 700; }
.hint { background: var(--warm-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin-bottom: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 16px; }
.check input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--accent); }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs .btn { flex: 1; padding: 8px 6px; min-height: 42px; font-size: 14px; }
.tabs .btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.speech { font-size: 21px; line-height: 1.75; }
.hid { display: inline-block; min-width: 2.2em; border-bottom: 2px solid var(--muted); color: transparent; cursor: pointer; position: relative; line-height: 1.2; }
.hid::before { content: attr(data-f); color: var(--muted); position: absolute; left: 0; }
.hid.show { color: var(--warm); border-color: var(--warm); }
.hid.show::before { content: ''; }
.rec { width: 92px; height: 92px; border-radius: 50%; border: 0; background: var(--bad); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 0 0 8px var(--bad-soft); }
.rec.on { animation: pulse 1.2s infinite; border-radius: 28px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 16px var(--bad-soft); } }
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
nav.tabbar > div { display: flex; width: 100%; max-width: 640px; }
nav.tabbar button { flex: 1; border: 0; background: none; padding: 10px 0 12px; font-size: 13px; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
nav.tabbar button.on { color: var(--accent); font-weight: 700; }
nav.tabbar svg { width: 24px; height: 24px; }
.path { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.dot { aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; background: var(--card); }
.dot.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dot.now { border-color: var(--warm); color: var(--warm); box-shadow: 0 0 0 3px var(--warm-soft); }
.dot.rv { border-style: dashed; }
.boxes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; align-items: end; height: 120px; margin: 8px 0 6px; }
.boxes > div { background: var(--accent-soft); border-radius: 8px 8px 4px 4px; position: relative; min-height: 6px; }
.boxes > div > b { position: absolute; top: -22px; left: 0; right: 0; text-align: center; font-size: 13px; }
.boxlbl { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; font-size: 11px; color: var(--muted); text-align: center; }
.wl { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.lv { font-size: 12px; color: var(--muted); white-space: nowrap; }
.big-num { font-size: 40px; font-weight: 800; line-height: 1; }
.celebrate { font-size: 56px; text-align: center; margin: 10px 0; }
.modal { position: fixed; inset: 0; background: rgba(10,12,18,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal .card { max-width: 480px; width: 100%; max-height: 90vh; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 30; font-size: 15px; }
.gap { height: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
a { color: var(--accent); }
audio { width: 100%; margin-top: 8px; }
.card.g-der { border: 3px solid var(--der); } .card.g-die { border: 3px solid var(--die); } .card.g-das { border: 3px solid var(--das); }
.gfig { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1.5px solid currentColor; margin: 2px 0; }
.pic { display: block; margin: 4px auto 6px; }
.pl { color: var(--muted); font-size: .62em; font-weight: 600; cursor: pointer; white-space: nowrap; }
.pl:hover { color: var(--ink); } .plspk { font-size: .8em; }
.merk { margin: 4px 0 12px; font-size: 15px; text-align: left; }
.merk > span { display: inline-block; background: var(--warm-soft); border-radius: 8px; padding: 4px 8px; }

</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<script src="content.js"></script>
<script src="pics.js"></script>
<script src="app.js"></script>
</body>
</html>
